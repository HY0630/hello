<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Launch Checklist</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div>
    <h1>Team Launch Checklist</h1>
    <p class="sub">Plan it, build it, approve it, ship it.</p>
  </div>
  <div class="actions">
    <button id="export-btn" type="button">Export JSON</button>
    <button id="import-btn" type="button">Import JSON</button>
    <button id="reset-btn" type="button" class="danger">Reset</button>
    <input id="import-file" type="file" accept="application/json" hidden />
  </div>
</header>

<section class="progress-wrap">
  <div class="progress-bar"><div id="progress-fill"></div></div>
  <span id="progress-label">0 of 0 complete</span>
</section>

<main id="board"></main>

<template id="section-template">
  <section class="card">
    <div class="card-head">
      <h2></h2>
      <span class="count"></span>
    </div>
    <ul class="tasks"></ul>
    <form class="add-form">
      <input type="text" placeholder="Add a task…" required maxlength="140" />
      <button type="submit">Add</button>
    </form>
  </section>
</template>

<script src="app.js"></script>
</body>
</html>
